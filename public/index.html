<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Study Buddy</title>
  <meta name="description" content="A mobile-friendly AI study assistant." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>AI Study Buddy<span class="dot">.</span></h1>
      <p class="subtitle">Ask a question and learn it step by step.</p>
    </header>

    <section class="chat-card">
      <div class="messages" id="messages">
        <div class="message assistant">
          Hi! I'm your study buddy. Ask me about any topic and I'll help you understand it.
        </div>
      </div>

      <div class="modes" id="modes" role="group" aria-label="Study mode">
        <button type="button" class="mode-btn active" data-mode="tutor" aria-pressed="true">Ask</button>
        <button type="button" class="mode-btn" data-mode="explain" aria-pressed="false">Explain simply</button>
        <button type="button" class="mode-btn" data-mode="quiz" aria-pressed="false">Quiz me</button>
        <button type="button" class="mode-btn" data-mode="summarize" aria-pressed="false">Summarize</button>
      </div>

      <form class="input-row" id="chat-form">
        <textarea
          id="message-input"
          rows="1"
          maxlength="4000"
          placeholder="Ask me anything you're studying..."
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </section>
  </main>

  <!-- Libraries that turn the AI's Markdown into safe HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
